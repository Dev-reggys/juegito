<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Gemini Master</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-overlay" class="overlay">
        <div class="login-box">
            <h1 id="auth-title">LOGIN</h1>
            <input type="text" id="username" placeholder="Usuario" autocomplete="off">
            <input type="password" id="password" placeholder="Contraseña">
            <button id="auth-main-btn" onclick="ejecutarAuth()">ENTRAR AL ARCADE</button>
            <p id="auth-msg"></p>
            <div class="auth-switch">
                <span id="switch-text">¿No tienes cuenta?</span>
                <button class="btn-link" id="switch-btn" onclick="alternarModoAuth()">Regístrate aquí</button>
            </div>
        </div>
    </div>

    <div id="game-over-modal" class="overlay hidden">
        <div class="modal-box">
            <h2 class="rainbow-text" style="font-size: 3rem; margin-bottom: 10px;">GAME OVER</h2>
            <p>PUNTUACIÓN FINAL:</p>
            <h3 id="final-score" style="font-size: 2.5rem; color: #00fbff; margin: 15px 0;">0</h3>
            
            <div style="display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
                <button class="btn-neon" onclick="startGame(currentRunningGame)">🎮 REINTENTAR</button>
                <button class="btn-neon" onclick="volverAlMenu()">🏠 VOLVER AL MENÚ</button>
            </div>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <aside class="sidebar">
            <h2 class="rainbow-text-small">ARCADE GEMINI</h2>
            <button onclick="startGame('guitar')">🎸 GUITAR MASTER</button>
            <button onclick="startGame('slither')">🐍 SLITHER.IO PRO</button>
            <button onclick="startGame('snake')">🟩 SNAKE NEON</button>
            <button onclick="startGame('geometry')">🤖 ROBOT PARKOUR</button>
            <button onclick="startGame('tetris')">🧱 TETRIS CLASSIC</button>
            <button onclick="showDinoCharacters()">🦖 DINO RUN</button>
            
            <button class="btn-logout" onclick="logout()">🚪 CERRAR SESIÓN</button>
        </aside>

        <main class="content">
            <div id="welcome-msg">
                <h1 class="rainbow-text">BIENVENIDO</h1>
                <div class="gif-container">
                    <img src="src/cat.gif" alt="Gato Arcade" class="welcome-gif">
                </div>
                <p>SELECCIONA UN JUEGO PARA EMPEZAR</p>
            </div>

            <div id="game-layout" class="hidden">
                <div id="stats-container">
                    <span id="game-title"></span>
                    <span id="score-label">SCORE: <span id="score">0</span></span>
                </div>

                <div class="canvas-container">
                    <canvas id="mainCanvas" width="400" height="400" tabindex="0"></canvas>
                    
                    <div id="guitar-controls" class="hidden">
                        <div class="lane-trigger" id="key-a">A</div>
                        <div class="lane-trigger" id="key-s">S</div>
                        <div class="lane-trigger" id="key-d">D</div>
                        <div class="lane-trigger" id="key-f">F</div>
                    </div>
                </div>

                <div class="ranking-box">
                    <h3>TOP SCORERS</h3>
                    <ul id="ranking-list"></ul>
                </div>
            </div>

            <div id="char-menu" class="hidden">
                <h2 class="rainbow-text-small">ELIGE TU PERSONAJE</h2>
                <div class="char-selector">
                    <button class="char-btn" onclick="startDino('🦖')">
                        <span>🦖</span> REX CLASSIC
                    </button>
                    <button class="char-btn" onclick="startDino('🤖')">
                        <span>🤖</span> CYBER DINO
                    </button>
                    <button class="char-btn" onclick="startDino('🐱')">
                        <span>🐱</span> NEKO DASH
                    </button>
                </div>
            </div>
        </main>
    </div>

    <audio id="slithertheme" src="src/slithertheme.mp3"></audio>
    <audio id="snaketheme" src="src/snaketheme.mp3"></audio>
    <audio id="geometrytheme" src="src/geometrytheme.mp3"></audio>
    <audio id="tetristheme" src="src/tetristheme.mp3"></audio>
    <audio id="dinotheme" src="src/dinotheme.mp3"></audio>
    <audio id="guitartheme" src="src/guitartheme.mp3"></audio>
    <audio id="menutheme" src="src/menuLoop.mp3"></audio>

    <script src="script.js"></script>
    <script src="guitar.js"></script>
    <script src="snake.js"></script>
    <script src="geometry.js"></script>
    <script src="tetrix.js"></script>
    <script src="dino.js"></script>
    <script src="slither.js"></script>

    <div class="canvas-container">
    <canvas id="mainCanvas" width="400" height="400" tabindex="0"></canvas>
    
    <div class="controls-container">
    <div class="lane-trigger">A</div>
    <div class="lane-trigger">S</div>
    <div class="lane-trigger">D</div>
    <div class="lane-trigger">F</div>
</div>
</div>
</body>
</html>
