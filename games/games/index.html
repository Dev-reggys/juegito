<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Gemini Master</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-overlay" class="overlay">
        <div class="login-box">
            <h1 id="auth-title">LOGIN</h1>
            <input type="text" id="username" placeholder="Usuario" autocomplete="off">
            <input type="password" id="password" placeholder="Contraseña">
            <button id="auth-main-btn" onclick="ejecutarAuth()">ENTRAR AL ARCADE</button>
            <p id="auth-msg"></p>
            <div class="auth-switch">
                <span id="switch-text">¿No tienes cuenta?</span>
                <button class="btn-link" id="switch-btn" onclick="alternarModoAuth()">Regístrate aquí</button>
            </div>
        </div>
    </div>

    <div id="game-over-modal" class="overlay hidden">
        <div class="modal-box">
            <h2 class="rainbow-text" style="font-size: 3rem; margin-bottom: 10px;">GAME OVER</h2>
            <p>PUNTUACIÓN FINAL:</p>
            <h3 id="final-score" style="font-size: 2.5rem; color: #00fbff; margin: 15px 0;">0</h3>
            
            <div style="display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
                <button class="btn-neon" onclick="startGame(currentRunningGame)">🎮 REINTENTAR</button>
                <button class="btn-neon" onclick="volverAlMenu()">🏠 VOLVER AL MENÚ</button>
            </div>
        </div>
    </div>

    <div id="main-app" class="hidden" style="display: flex; width: 100vw; height: 100vh;">
        
        <aside class="sidebar">
            <h2 class="rainbow-text-small">ARCADE 1987</h2>
            <button class="btn-guitar" onclick="startGame('guitar')">🎸 GUITAR MASTER</button>
            <button class="btn-slither" onclick="startGame('slither')">🐍 SLITHER.IO PRO</button>
            <button class="btn-snake" onclick="startGame('snake')"> SNAKE</button>
            <button class="btn-robot" onclick="startGame('geometry')">🟩 Imposible Game</button>
            <button class="btn-tetris" onclick="startGame('tetris')">🧱 TETRIX</button>
            <button class="btn-dino" onclick="showDinoCharacters()">🦖 DINO RUN</button>
            
            <button class="btn-logout" onclick="logout()">🚪 CERRAR SESIÓN</button>
        </aside>

        <main class="content">
            
            <button id="btn-mute" class="mute-control">
                <span id="mute-icon">🔊</span>
            </button>

            <div id="welcome-msg">
                <h1 class="rainbow-text">BIENVENIDO, <span id="user-display"></span></h1>
                <div class="gif-container">
                    <img src="src/cat.gif" alt="Gato Arcade" class="welcome-gif">
                </div>
                <p>SELECCIONA UN JUEGO PARA EMPEZAR</p>
            </div>

            <div id="char-menu" class="hidden">
                <h2 class="rainbow-text-small">ELIGE TU PERSONAJE</h2>
                <div class="char-selector">
                    <button class="char-btn" onclick="startDino('🦖')"><span>🦖</span> REX Google</button>
                    <button class="char-btn" onclick="startDino('🤖')"><span>🤖</span> CYBER DINO</button>
                    <button class="char-btn" onclick="startDino('🐱')"><span>🐱</span> NEKO DASH</button>
                </div>
            </div>
<div id="game-layout" class="hidden">
                <div class="game-column">
                    <div id="stats-container">
                        <span id="game-title"></span>
                        <div style="display: flex; gap: 20px; justify-content: center; margin-bottom: 10px;">
                            <span id="score-label" style="font-weight: bold;">SCORE: <span id="score">0</span></span>
                            <span id="lives-label" style="font-weight: bold;">LIVES: <span id="lives">❤️❤️❤️</span></span>
                        </div>
                    </div>

                    <div class="canvas-container">
                        <canvas id="mainCanvas" width="400" height="450" tabindex="0"></canvas>
                        
                        <div id="guitar-controls" class="hidden">
                            <div class="lane-trigger" id="key-a">A</div>
                            <div class="lane-trigger" id="key-s">S</div>
                            <div class="lane-trigger" id="key-d">D</div>
                            <div class="lane-trigger" id="key-f">F</div>
                        </div>
                    </div>
                </div>

                <div class="ranking-box">
                    <h3 style="color: #00fbff; margin-bottom: 15px;">TOP SCORERS</h3>
                    <ul id="ranking-list" style="list-style: none; padding: 0;"></ul>
                </div>
            </div>
        

    <audio id="slithertheme" src="src/slithertheme.mp3"></audio>
    <audio id="snaketheme" src="src/snaketheme.mp3"></audio>
    <audio id="geometrytheme" src="src/geometrytheme.mp3"></audio>
    <audio id="tetristheme" src="src/tetristheme.mp3"></audio>
    <audio id="dinotheme" src="src/dinotheme.mp3"></audio>
    <audio id="guitartheme" src="src/guitartheme.mp3"></audio>
    <audio id="menutheme" src="src/menuloop.mp3"></audio>

    <video src="src/susto.mp4" class="nyan-cat" autoplay loop muted></video>

    <script src="script.js"></script>
    <script src="guitar.js"></script>
    <script src="snake.js"></script>
    <script src="geometry.js"></script>
    <script src="tetrix.js"></script>
    <script src="dino.js"></script>
    <script src="slither.js"></script>
</body>
</html>
